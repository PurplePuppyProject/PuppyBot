[package]
name = "puppybot-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
puppybot = { path = "../crates/puppybot" }

# A workspace of its own, so the Cargo.lock of PuppyBot stays free of fuzzing dependencies.
[workspace]
members = ["."]

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interaction"
path = "fuzz_targets/interaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_command"
path = "fuzz_targets/text_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_file"
path = "fuzz_targets/token_file.rs"
test = false
doc = false
bench = false
