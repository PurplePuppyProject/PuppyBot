# The crates of PuppyBot, see Project Layout in the README:
# - crates/puppybot-core: the bot's logic, parsers and texts, without Discord, storage or I/O
# - crates/puppybot: the program, which connects that logic to Discord, storage and the network
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# The version of PuppyBot, which make version sets, see Releasing in the README.
version = "0.1.0"
edition = "2024"
# Keep in sync with the job msrv in .github/workflows/rust-build.yml.
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/PurplePuppyProject/PuppyBot"
# A program, deployed as a Docker image, not libraries for crates.io.
publish = false

[workspace.dependencies]
puppybot-core = { path = "crates/puppybot-core" }
# Each with only the features PuppyBot uses.
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "signal"] }
# Without the feature unbounded: the parser limits how deeply tables and arrays may nest.
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
# Without the macro #[instrument], whose async functions code coverage can't see into.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std", "tracing-log"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-llvm-cov sets cfg(coverage), on nightly also cfg(coverage_nightly). cargo fuzz sets
# cfg(fuzzing), which makes the entry points for fuzzing public, see fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)", "cfg(fuzzing)"] }

[workspace.lints.clippy]
# Strict from the start, which costs less than tightening later: the pedantic lints, and nothing
# that panics on input the bot gets, so a message can't stop it. Tests may unwrap, expect and
# panic, see clippy.toml. CI turns all warnings into errors.
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
# An overflow is a bug: stop instead of computing with a wrong number.
overflow-checks = true
