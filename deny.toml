# Checks of the dependencies with cargo deny, run by .github/workflows/deny.yml:
# - advisories: known vulnerabilities, unmaintained or unsound crates, yanked versions
# - licenses: only licenses compatible with the GPL-3.0-only of PuppyBot
# - bans: no wildcard version requirements
# - sources: crates only from crates.io
#
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
# The targets that releases and the Docker image exist for, see .github/workflows/release.yml.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# An exception needs an entry here, with the reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "..." }
ignore = []

[licenses]
# Each license must allow combining the crate with GPL-3.0-only code.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list holds the usual licenses of Rust crates. One that no dependency has (yet) is fine.
unused-allowed-license = "allow"

[bans]
# Several versions of a crate cost build time and size, but aren't a risk on their own.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
