# Checks of the dependencies with cargo deny, run by .github/workflows/deny.yml:
# - advisories: known vulnerabilities, unmaintained or unsound crates, yanked versions
# - licenses: only licenses compatible with the GPL-3.0-only of PuppyBot
# - bans: no wildcard version requirements, and none of the crates that the decisions in
#   docs/PLAN.md rule out
# - sources: crates only from crates.io
#
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
# The targets that releases and the Docker image exist for, see .github/workflows/release.yml.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# An exception needs an entry here, with the reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "..." }
ignore = []

[licenses]
# Each license must allow combining the crate with GPL-3.0-only code.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list holds the usual licenses of Rust crates. One that no dependency has (yet) is fine.
unused-allowed-license = "allow"

[bans]
# Several versions of a crate cost build time and size, but aren't a risk on their own.
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace depend on each other by path, which isn't a wildcard for crates
# that aren't published.
allow-wildcard-paths = true
# TLS goes through rustls with ring as its cryptography (see docs/PLAN.md), so neither a second
# cryptography library nor OpenSSL. rustls and most crates that use it enable aws-lc-rs by
# default: turn their default features off and choose ring.
deny = [
    { crate = "aws-lc-rs", reason = "rustls uses ring, see docs/PLAN.md" },
    { crate = "aws-lc-sys", reason = "rustls uses ring, see docs/PLAN.md" },
    { crate = "native-tls", reason = "TLS only with rustls, see docs/PLAN.md" },
    { crate = "openssl", reason = "TLS only with rustls, see docs/PLAN.md" },
    { crate = "openssl-sys", reason = "TLS only with rustls, see docs/PLAN.md" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
